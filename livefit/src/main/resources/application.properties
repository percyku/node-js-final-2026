spring.application.name=livefit

# ===== 環境變數來源 =====
# 讀取 livefit/.env（Spring Boot 3 原生支援，不需 spring-dotenv 之類的套件）。
# [.properties] 是格式提示，告訴 Boot 用 Java properties 的規則解析這個沒有副檔名的檔案。
# optional: 表示檔案不存在也不會讓應用程式啟動失敗，此時一律使用下方 ${VAR:預設值} 的預設值。
# 真正的作業系統環境變數優先權仍高於 .env，容器化時可直接用環境變數覆蓋。
spring.config.import=optional:file:.env[.properties]

# ===== Server =====
server.port=${PORT:8080}

# ===== PostgreSQL =====
# 預設值對齊 livefit/.env.example；容器化時 DB_HOST 要改成 postgres
# 使用獨立的 livefit 資料庫，不與 Node 版的 fitness 共用（預設值刻意不是 fitness，避免誤改原始 DB）
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:livefit}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:student666}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# schema 由 Hibernate 依 Entity 自動建立 / 補欄位（update 只增不刪，不會移除既有欄位或資料）
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# 資料庫欄位是 timestamp without time zone，統一以 UTC 讀寫
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hibernate 6 預設把 Instant 建成 timestamp with time zone，這裡固定成 without time zone
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# ===== Jackson =====
# openapi 規定時間一律輸出 UTC ISO 8601（2026-08-20T10:00:00.000Z）
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Spring MVC =====
# 打開後找不到路由才會丟 NoHandlerFoundException，交給 GlobalExceptionHandler 回 404 無此路由
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ===== JWT =====
jwt.secret=${JWT_SECRET:node2026percyku-livefit-default-secret-please-change}
jwt.expires-day=${JWT_EXPIRES_DAY:30d}

# ===== Google 登入 =====
# Google Cloud Console 建立的 OAuth 2.0 Client ID（Web application），需與前端 VITE_GOOGLE_CLIENT_ID 相同。
# 留空不會讓啟動失敗，只是 POST /api/users/google 會回 400。
google.client-id=${GOOGLE_CLIENT_ID:}
