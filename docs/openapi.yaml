                更新失敗:
                  summary: 更新沒有生效（邊角情況）
                  value:
                    status: failed
                    message: 更新使用者資料失敗
        '401':
          description: |
            token 驗證失敗。下方是建議回應範例；驗收重點是 4xx + status: failed。只有「請先登入」是固定錯誤訊息文字，必須完全相同。
            - 沒帶 Authorization header、或格式不是 Bearer <token>：「請先登入」
            - token 已過期：「Token 已過期」
            - token 無效（內容不對、或查無此使用者）：「無效的 token」
            ⚠️「請先登入」是四句固定錯誤訊息文字之一，一個字都不能改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                未帶token:
                  summary: 沒帶 Authorization header 或缺 token
                  value:
                    status: failed
                    message: 請先登入
                token過期:
                  summary: token 已過期
                  value:
                    status: failed
