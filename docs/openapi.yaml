                      user:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 小華二號
              example:
                status: success
                data:
                  user:
                    name: 小華二號
        '400':
          description: |
            更新失敗。下方是建議回應範例；驗收重點是 4xx + status: failed。
            - name 缺漏或為空字串：「欄位未填寫正確」
            - ⚠️ 新名稱與目前名稱相同：「使用者名稱未變更」
