        回傳這位教練所有「未結束」的課程。判斷標準：end_at > 現在時間。
        也就是「尚未開始」和「進行中」的課都要回，只排除已經下課的。

        ⚠️ 時間口徑地雷：這支跟 GET /api/courses 的篩選條件「不一樣」，驗收會分開測——
        - 這支（教練課表）：end_at > now（未結束，含尚未開始的課）
        - GET /api/courses（全站課程）：start_at <= now < end_at（只有進行中）
        不要兩支寫成同一個條件。

        ⚠️ 欄位地雷：每筆課程要多附 coach_name（教練名字）和 skill_name（技能名稱）——這兩個不是課程自己的欄位，要自己組出來放進去。
        日期欄位 start_at／end_at 一律回 UTC ISO 8601 字串。
        教練存在但沒有未結束的課 → 回空陣列（成功），不是錯誤；查不到教練 → 失敗，message 是「找不到該教練」。
        狀態碼尺度：驗收只看「2xx／4xx」加上 body 的 `status` 欄位，實際數字供參考。
      parameters:
        - name: coachId
