                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: 課程 id（uuid）
                        name:
                          type: string
                        description:
                          type: string
                        start_at:
                          type: string
                          description: UTC ISO 8601 時間字串
                        end_at:
                          type: string
                          description: UTC ISO 8601 時間字串
                        max_participants:
                          type: integer
                        coach_name:
                          type: string
                          description: 教練名字（要自己組進來）
                        skill_name:
