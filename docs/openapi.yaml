                redirect_uri:
                  type: string
                  description: 前端導向 Facebook 授權頁時使用的 redirect_uri
                  example: http://localhost:5173/oauth/callback/facebook
            example:
              code: AQBx7kZ3vYq2mN8pL5tR
              redirect_uri: http://localhost:5173/oauth/callback/facebook
      responses:
        '201':
          description: 登入成功，回應格式與 POST /api/users/login 相同
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: 本站的 JWT token（不是 Facebook 的 access token），payload 必含 { id, role, exp }
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjBmZDk2YjNjIiwicm9sZSI6IlVTRVIiLCJleHAiOjE3NTAwMDAwMDB9.signature
                      user:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 小華
              example:
                status: success
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjBmZDk2YjNjIiwicm9sZSI6IlVTRVIiLCJleHAiOjE3NTAwMDAwMDB9.signature
                  user:
                    name: 小華
        '400':
          description: |
            登入失敗。
            - code 缺漏／空字串，或 redirect_uri 缺漏／不在白名單內：「欄位未填寫正確」
            - 後端沒有設定 FACEBOOK_APP_ID 或 FACEBOOK_APP_SECRET：「尚未設定 Facebook 登入」
            - code 無效、已使用過或已過期，或連不上 Facebook：「Facebook 登入驗證失敗」
            - Facebook 帳號沒有 email，或使用者沒有同意提供 email：「此 Facebook 帳號沒有提供 Email，無法登入」
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                欄位錯誤:
                  summary: code 或 redirect_uri 缺漏，或 redirect_uri 不在白名單
                  value:
                    status: failed
                    message: 欄位未填寫正確
                尚未設定:
                  summary: 後端未設定 Facebook 應用程式編號 / 密鑰
                  value:
                    status: failed
                    message: 尚未設定 Facebook 登入
                驗證失敗:
                  summary: code 無法換到使用者資料
                  value:
                    status: failed
                    message: Facebook 登入驗證失敗
                沒有Email:
                  summary: Facebook 沒有提供 email
                  value:
                    status: failed
                    message: 此 Facebook 帳號沒有提供 Email，無法登入
        '409':
          description: 這個 Email 已經有帳號。Facebook 的 email 沒有驗證旗標，不會自動綁定
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              example:
                status: failed
                message: 此 Email 已註冊，請改用原本的方式登入
  /api/users/profile:
    get:
      tags:
        - M2 會員系統
      summary: 取得本人的個人資料
      description: |
        回傳目前登入者的 name 與 email。Spring Boot 版另外多回一個 has_password。

        行為備註：
        - 前端每次切換頁面（只要身上有 token）都會打一次這支來確認登入狀態——
          這支沒做好，整個登入後的畫面都進不去。
        - 成功 200，data.user 是 { name, email }。
        - 僅 Spring Boot 版：多一個 has_password（布林）。用第三方登入建立、或登入方式被重設過的帳號沒有密碼，
          前端依此決定「修改密碼」要不要顯示舊密碼欄位。Node 版沒有這個欄位，前端當成 true。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功取得個人資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 小華
                          email:
                            type: string
                            example: xiaohua@example.com
                          has_password:
                            type: boolean
                            description: 僅 Spring Boot 版。帳號目前有沒有密碼
                            example: true
              example:
                status: success
                data:
                  user:
                    name: 小華
                    email: xiaohua@example.com
        '401':
          description: |
            token 驗證失敗。下方是建議回應範例；驗收重點是 4xx + status: failed。只有「請先登入」是固定錯誤訊息文字，必須完全相同。
            - 沒帶 Authorization header、或格式不是 Bearer <token>：「請先登入」
            - token 已過期：「Token 已過期」
            - token 無效（內容不對、或查無此使用者）：「無效的 token」
            ⚠️「請先登入」是四句固定錯誤訊息文字之一，一個字都不能改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                未帶token:
                  summary: 沒帶 Authorization header 或缺 token
                  value:
                    status: failed
                    message: 請先登入
                token過期:
                  summary: token 已過期
                  value:
                    status: failed
                    message: Token 已過期
                token無效:
                  summary: token 無效或查無此使用者
                  value:
                    status: failed
                    message: 無效的 token
    put:
      tags:
        - M2 會員系統
      summary: 更新本人的暱稱
      description: |
        更新目前登入者的暱稱（name），一次只能改這一個欄位。

        行為備註：
        - ⚠️ 新名稱跟目前的名稱「一模一樣」會直接失敗，回 400「使用者名稱未變更」——
          這不是 bug，是規格。前端沒有擋「沒改就送出」，使用者沒改名就按儲存，
          看到這個錯誤訊息是預期行為，請不要把它改成成功。
        - 成功 200，回更新後的 data.user（只有 name 欄位）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
