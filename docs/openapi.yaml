  /api/users/courses:
    get:
      tags:
        - M5 購買與報名
      summary: 取得本人的課表與剩餘堂數
      description: |
        回傳目前登入者的剩餘堂數、已使用堂數、以及所有報名過的課程清單（含已取消）。

        data 形狀固定三個欄位：
        - credit_remain：剩餘堂數
        - credit_usage：已使用堂數
        - course_booking：報名紀錄陣列

        行為備註：
        - ⚠️ credit_remain 的口徑：剩餘堂數 ＝「全部購買的堂數加總」−「未取消的報名數」。
          沒有任何地方存「餘額」這個欄位，每次都要用這條公式現算；
          已取消的報名不佔堂數（取消會把堂數還回來）。
        - credit_usage ＝ 未取消的報名數（跟上面公式的右半邊是同一個數字）。
        - ⚠️ course_booking「包含已取消的報名」——cancelled_at 有值代表已取消、null 代表有效。
          前端靠 cancelled_at 來顯示狀態，不要自作主張把已取消的過濾掉。
        - 排序：依課程 start_at 由舊到新（ASC）。
        - 每筆形狀：{ course_id, name, start_at, end_at, meeting_url, coach_name, cancelled_at }，
          coach_name 是開課教練的名稱、course_id 是 uuid 字串。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功取得課表（從未報名過時 course_booking 為空陣列）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      credit_remain:
                        type: integer
                        description: 剩餘堂數 ＝ Σ購買堂數 − 未取消報名數
                        example: 12
                      credit_usage:
                        type: integer
                        description: 已使用堂數（未取消的報名數）
                        example: 2
                      course_booking:
                        type: array
                        description: 報名紀錄（含已取消），依 start_at 由舊到新
                        items:
                          type: object
                          properties:
                            course_id:
                              type: string
                              description: 課程 id（uuid 字串）
                              example: 5b1c3e6a-2f4d-4e8b-9a7c-d1e2f3a4b5c6
                            name:
                              type: string
                              description: 課程名稱
                              example: 瑜伽入門體驗
                            start_at:
                              type: string
                              description: 上課開始時間（UTC ISO 8601）
                              example: 2026-08-20T10:00:00.000Z
                            end_at:
                              type: string
                              description: 上課結束時間（UTC ISO 8601）
                              example: 2026-08-20T12:00:00.000Z
                            meeting_url:
                              type: string
                              description: 線上教室連結
                              example: https://meet.example.com/yoga-101
                            coach_name:
                              type: string
                              description: 開課教練的名稱
                              example: 教練小美
                            cancelled_at:
                              type: string
                              nullable: true
                              description: 取消時間；null 代表此報名仍有效
                              example: null
              example:
                status: success
                data:
                  credit_remain: 12
                  credit_usage: 2
                  course_booking:
                    - course_id: 5b1c3e6a-2f4d-4e8b-9a7c-d1e2f3a4b5c6
                      name: 瑜伽入門體驗
                      start_at: '2026-08-20T10:00:00.000Z'
                      end_at: '2026-08-20T12:00:00.000Z'
                      meeting_url: https://meet.example.com/yoga-101
                      coach_name: 教練小美
                      cancelled_at: null
                    - course_id: 7a2d4f8b-3c5e-4a9d-b1f2-e3a4b5c6d7e8
                      name: 重訓基礎課
                      start_at: '2026-09-01T13:00:00.000Z'
                      end_at: '2026-09-01T15:00:00.000Z'
                      meeting_url: https://meet.example.com/fitness-201
                      coach_name: 教練小明
                      cancelled_at: '2026-08-15T06:30:00.000Z'
        '401':
          description: |
            token 驗證失敗。下方是建議回應範例；驗收重點是 4xx + status: failed。只有「請先登入」是固定錯誤訊息文字，必須完全相同。
            - 沒帶 Authorization header、或格式不是 Bearer <token>：「請先登入」
            - token 已過期：「Token 已過期」
            - token 無效（內容不對、或查無此使用者）：「無效的 token」
            ⚠️「請先登入」是四句固定錯誤訊息文字之一，一個字都不能改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                未帶token:
                  summary: 沒帶 Authorization header 或缺 token
                  value:
                    status: failed
                    message: 請先登入
                token過期:
                  summary: token 已過期
                  value:
                    status: failed
                    message: Token 已過期
                token無效:
                  summary: token 無效或查無此使用者
                  value:
                    status: failed
                    message: 無效的 token
  # ===== g3-admin-coach =====
  /api/admin/coaches/{userId}:
    post:
      tags:
        - M3 教練後台
      summary: 將指定使用者升級為教練
      description: |
        把一般使用者（role 為 USER）升級成教練：建立一筆教練資料，並把該使用者的 role 改成 COACH。升級成功後，這位使用者就能登入使用教練後台的功能。

        ⚠️ **安全性註記（課程簡化）**：這支 API 是 public、**不需要登入**就能呼叫。真實世界的系統絕對不會讓任何人都能把別人升級成教練——正式產品這種端點一定要做身分與權限控管。本課程為了讓大家專注在主流程，刻意簡化，請記得這不是正常設計。

        行為備註：
        - `profile_image_url` 是**選填**：可以整個不給、也可以給空字串，都會過。但只要有給非空的值，就必須以 `https` 開頭，否則回 400「欄位未填寫正確」。
        - ⚠️ 注意：這條規則跟「更新教練資料（PUT /api/admin/coaches）」**不一樣**（那支是必填），對照表請看 PUT 那支的說明。
        - 同一個使用者只能升級一次：已經是教練再打一次會回 409「使用者已經是教練」。
        - 文件寫的狀態碼（201/400/409）是答案版實際行為，供參考；**驗收只看「成功 2xx / 失敗 4xx」加上回應的 status 欄位**，不逐碼比對。
      parameters:
        - name: userId
          in: path
          required: true
          description: 要升級的使用者 id（uuid 字串）
          schema:
            type: string
            format: uuid
          example: "f3b7d2c1-8a4e-4c6f-9d2b-5e1a7c3f9b8d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - experience_years
                - description
              properties:
                experience_years:
                  type: integer
                  minimum: 0
                  description: 教練年資（數字、不能是負數或小數）
                description:
                  type: string
                  description: 教練介紹（不能是空字串）
                profile_image_url:
                  type: string
                  description: 大頭貼網址。選填，可不給或給空字串；但只要有值就必須以 https 開頭
              example:
                experience_years: 3
                description: "瑜伽與皮拉提斯雙修，擅長帶初學者"
                profile_image_url: "https://example.com/avatar.png"
      responses:
        "201":
          description: 升級成功，回傳更新後的使用者（role 已變 COACH）與新建立的教練資料
          content:
            application/json:
              example:
                status: success
                data:
                  user:
                    name: "小美"
                    role: "COACH"
                  coach:
                    id: "a1c5e8f2-3b7d-4e9a-8c6f-2d4b9e1a7c3f"
                    user_id: "f3b7d2c1-8a4e-4c6f-9d2b-5e1a7c3f9b8d"
                    experience_years: 3
                    description: "瑜伽與皮拉提斯雙修，擅長帶初學者"
                    profile_image_url: "https://example.com/avatar.png"
                    created_at: "2026-08-20T10:00:00.000Z"
                    updated_at: "2026-08-20T10:00:00.000Z"
        "400":
          description: |
            可預期的失敗，依情境回不同訊息：
            - 欄位缺漏或格式不對（experience_years 不是 0 以上的整數、description 是空字串、profile_image_url 有值但不是 https 開頭）→「欄位未填寫正確」
            - userId 查不到對應的使用者 →「使用者不存在」
          content:
            application/json:
              examples:
                欄位未填寫正確:
                  summary: 欄位缺漏、格式錯誤、或大頭貼網址不是 https 開頭
                  value:
                    status: failed
                    message: "欄位未填寫正確"
                使用者不存在:
                  summary: userId 查無此使用者
                  value:
                    status: failed
                    message: "使用者不存在"
        "409":
          description: 該使用者已經是教練（重複升級）
          content:
            application/json:
              example:
                status: failed
                message: "使用者已經是教練"
  /api/admin/coaches:
    get:
      tags:
        - M3 教練後台
      summary: 取得教練本人的後台資料（含技能清單）
      description: |
        教練登入後查看自己的教練資料，通常用來把資料塞進「編輯教練資料」的表單。需要登入，而且登入的人必須已經是教練。

        行為備註：
        - 回傳的 `id` 是**教練資料的 id**，不是使用者 id，兩個是不同的東西，不要拿去當 userId 用。
        - `skill_ids` 是這位教練目前綁定的技能 id 清單（uuid 字串陣列）；還沒設定過技能時會回空陣列 `[]`。
        - 剛升級、還沒填過大頭貼的教練，`profile_image_url` 可能是 null。⚠️ 把這份資料塞進表單後直接按儲存會吃 400，原因看 PUT 那支的說明。

        ⚠️ **固定錯誤訊息文字**：沒帶 token 時回的「請先登入」是前端會直接拿來判斷畫面的四句固定錯誤訊息文字之一，**一字不能差**（不能寫成「請登入」「尚未登入」等變體），否則前端成品會壞掉。

        文件寫的狀態碼是答案版實際行為，供參考；**驗收只看「成功 2xx / 失敗 4xx」加上回應的 status 欄位**。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功取得教練本人資料
          content:
            application/json:
              example:
                status: success
                data:
                  id: "a1c5e8f2-3b7d-4e9a-8c6f-2d4b9e1a7c3f"
                  experience_years: 3
                  description: "瑜伽與皮拉提斯雙修，擅長帶初學者"
                  profile_image_url: "https://example.com/avatar.png"
                  skill_ids:
                    - "7e2f9a4b-1c8d-4f6e-b3a5-9d7c2e4f8a1b"
                    - "3c6e1f8a-5b2d-4a9c-8e7f-1b4d6a9c3e5f"
        "401":
          description: |
            登入或身分檢查失敗，依情境回不同訊息：
            - 沒帶 Authorization header 或沒帶 token →「請先登入」（⚠️ 固定錯誤訊息文字，一字不差）
            - token 已過期 →「Token 已過期」
            - token 無效或查無此使用者 →「無效的 token」
            - 有登入但還不是教練 →「使用者尚未成為教練」（注意：這裡回的是 401，不是 403）
          content:
            application/json:
              examples:
                請先登入:
                  summary: 沒帶 token（⚠️ 訊息為固定錯誤訊息文字）
                  value:
                    status: failed
                    message: "請先登入"
                Token 已過期:
                  summary: token 過期
                  value:
                    status: failed
                    message: "Token 已過期"
                無效的 token:
                  summary: token 無效或查無使用者
                  value:
                    status: failed
                    message: "無效的 token"
                使用者尚未成為教練:
                  summary: 已登入但 role 不是 COACH
                  value:
                    status: failed
                    message: "使用者尚未成為教練"
    put:
      tags:
        - M3 教練後台
      summary: 更新教練本人的後台資料（含整批更換技能）
      description: |
        教練更新自己的年資、介紹、大頭貼與技能清單。需要登入，而且登入的人必須已經是教練。成功後回傳更新完的同形狀資料，前端可以直接拿來覆蓋表單。

        ⚠️ **profile_image_url 規則跟「升級教練」那支不一樣**，這是最容易踩的坑，對照表如下：

        | 規則 | 升級教練 POST /api/admin/coaches/{userId} | 更新教練資料 PUT /api/admin/coaches |
        |---|---|---|
        | 是否必填 | 選填（可不給、可空字串） | **必填**（不給或空字串直接 400） |
        | 格式要求 | 有值時必須以 https 開頭 | 必須以 https 開頭 |

        ⚠️ 連鎖地雷：升級時沒填大頭貼的教練，GET 拿到的 `profile_image_url` 是 null；前端把它原樣塞進表單、使用者沒補就按儲存，這支會回 400「欄位未填寫正確」。做前端串接時記得引導使用者先補上 https 開頭的網址。

        行為備註：
        - `skill_ids` 是**整批覆蓋**：你送出的清單會完全取代原本的技能清單（不是「新增」也不是「合併」）。想保留原本的技能，就要連舊的一起送。
        - `skill_ids` 必須是**非空陣列**，且每個元素都是技能的 id（uuid 字串）；空陣列回 400「欄位未填寫正確」。
        - 文件寫的狀態碼是答案版實際行為，供參考；**驗收只看「成功 2xx / 失敗 4xx」加上回應的 status 欄位**。
        - 沒帶 token 回的「請先登入」是固定錯誤訊息文字（同 GET 的說明），一字不能差。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - experience_years
                - description
                - profile_image_url
                - skill_ids
              properties:
                experience_years:
                  type: integer
                  minimum: 0
                  description: 教練年資（數字、不能是負數或小數）
                description:
                  type: string
                  description: 教練介紹（不能是空字串）
                profile_image_url:
                  type: string
                  description: 大頭貼網址。這支是必填，且必須以 https 開頭（⚠️ 跟升級教練那支的選填規則不同）
                skill_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                  description: 技能 id 清單（整批覆蓋原有技能，不能是空陣列）
              example:
                experience_years: 5
                description: "重訓與體態雕塑，協助學員建立規律訓練習慣"
                profile_image_url: "https://example.com/new-avatar.png"
                skill_ids:
                  - "7e2f9a4b-1c8d-4f6e-b3a5-9d7c2e4f8a1b"
                  - "3c6e1f8a-5b2d-4a9c-8e7f-1b4d6a9c3e5f"
      responses:
        "200":
          description: 更新成功，回傳更新後的教練資料（形狀與 GET 相同，可直接覆蓋表單）
          content:
            application/json:
              example:
                status: success
                data:
                  id: "a1c5e8f2-3b7d-4e9a-8c6f-2d4b9e1a7c3f"
                  experience_years: 5
                  description: "重訓與體態雕塑，協助學員建立規律訓練習慣"
                  profile_image_url: "https://example.com/new-avatar.png"
                  skill_ids:
                    - "7e2f9a4b-1c8d-4f6e-b3a5-9d7c2e4f8a1b"
                    - "3c6e1f8a-5b2d-4a9c-8e7f-1b4d6a9c3e5f"
        "400":
          description: |
            欄位缺漏或格式不對，一律回「欄位未填寫正確」。會觸發的情境：
            - experience_years 不是 0 以上的整數
            - description 沒給或是空字串
            - profile_image_url 沒給、是空字串、或不是 https 開頭（⚠️ 這支是必填）
            - skill_ids 沒給、不是陣列、是空陣列、或元素不是有效的 id 字串
          content:
            application/json:
              example:
                status: failed
                message: "欄位未填寫正確"
        "401":
          description: |
            登入或身分檢查失敗，依情境回不同訊息：
            - 沒帶 Authorization header 或沒帶 token →「請先登入」（⚠️ 固定錯誤訊息文字，一字不差）
            - token 已過期 →「Token 已過期」
            - token 無效或查無此使用者 →「無效的 token」
            - 有登入但還不是教練 →「使用者尚未成為教練」（注意：這裡回的是 401，不是 403）
          content:
            application/json:
              examples:
                請先登入:
                  summary: 沒帶 token（⚠️ 訊息為固定錯誤訊息文字）
                  value:
                    status: failed
                    message: "請先登入"
                Token 已過期:
                  summary: token 過期
                  value:
                    status: failed
                    message: "Token 已過期"
                無效的 token:
                  summary: token 無效或查無使用者
                  value:
                    status: failed
                    message: "無效的 token"
                使用者尚未成為教練:
                  summary: 已登入但 role 不是 COACH
                  value:
                    status: failed
                    message: "使用者尚未成為教練"
  # ===== g4-admin-courses =====
  /api/admin/coaches/courses:
    get:
      tags:
        - M3 教練後台
      summary: 取得教練本人開設的全部課程列表
      description: |
        教練後台「課程管理」頁的列表資料。需要登入，且登入者必須已經是教練（role 為 COACH）。

        行為備註：
        - 只會回「自己開的課」，依登入者的 token 判斷，不會看到別的教練的課程。
        - ⚠️ `status` 是三態中文字串（`尚未開始`／`進行中`／`已結束`），由伺服器**收到請求的當下時間**即時計算，不是存起來的欄位。同一堂課今天查是「尚未開始」，開課後再查就變「進行中」。
        - ⚠️ `participants` 是該課程「未取消」的報名數——已取消的報名不計。
        - 還沒開過任何課時回 `data: []`（空陣列），這是成功回應，不是錯誤。
        - 驗收口徑：文件標的狀態碼數字供參考，驗收只看 2xx／4xx 與 body 的 `status` 欄位。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功取得課程列表（沒開過課時 data 為空陣列）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    description: 教練本人的課程陣列，無課程時為空陣列
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: 課程 id（uuid）
                          example: 5e3b1f0a-9c1d-4e2f-8a7b-1c2d3e4f5a6b
                        name:
                          type: string
                          example: 重訓基礎入門
                        status:
                          type: string
                          description: 三態中文字串，用當下時間即時計算
                          enum:
                            - 尚未開始
                            - 進行中
                            - 已結束
                          example: 尚未開始
                        start_at:
                          type: string
                          description: 課程開始時間（UTC ISO 8601）
                          example: '2026-08-20T10:00:00.000Z'
                        end_at:
                          type: string
                          description: 課程結束時間（UTC ISO 8601）
                          example: '2026-08-20T12:00:00.000Z'
                        max_participants:
                          type: integer
                          example: 10
                        meeting_url:
                          type: string
                          example: 'https://meet.example.com/abc-defg-hij'
                        participants:
                          type: integer
                          description: 未取消的報名數。⚠️ 答案版有報名時會回數字字串（如 "2"）、無報名時回數字 0，驗收兩種型別都收，建議統一回數字
                          example: 2
              example:
                status: success
                data:
                  - id: 5e3b1f0a-9c1d-4e2f-8a7b-1c2d3e4f5a6b
                    name: 重訓基礎入門
                    status: 尚未開始
                    start_at: '2026-08-20T10:00:00.000Z'
                    end_at: '2026-08-20T12:00:00.000Z'
                    max_participants: 10
                    meeting_url: 'https://meet.example.com/abc-defg-hij'
                    participants: 2
        '401':
          description: |
            未登入、token 有問題、或登入者不是教練時觸發。
            ⚠️ 「請先登入」是前端會拿來判斷畫面的固定錯誤訊息文字，一字不差。
            觸發條件對照：沒帶 Authorization header 或格式不對 →「請先登入」；token 過期 →「Token 已過期」；token 無效或查無使用者 →「無效的 token」；登入了但不是教練 →「使用者尚未成為教練」（注意是 401 不是 403）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                未帶token:
                  summary: 沒帶 Authorization header
                  value:
                    status: failed
                    message: 請先登入
                token過期:
                  summary: token 已過期
                  value:
                    status: failed
                    message: Token 已過期
                token無效:
                  summary: token 無效或查無使用者
                  value:
                    status: failed
                    message: 無效的 token
                不是教練:
                  summary: 登入者 role 不是 COACH
                  value:
                    status: failed
                    message: 使用者尚未成為教練
    post:
      tags:
        - M3 教練後台
      summary: 教練開設新課程
      description: |
        教練後台「新增課程」modal 送出時呼叫。需要登入，且登入者必須已經是教練。

        行為備註：
        - ⚠️ 全部欄位都是必填，缺一個、或是空字串，就回「欄位未填寫正確」。
        - ⚠️ `meeting_url` 必須以 `https` 開頭，否則一樣回「欄位未填寫正確」。
        - ⚠️ `max_participants` 必須是「數字型別」的 0 以上整數——送字串 `"10"` 會被擋下來。
        - `start_at`／`end_at` 收 UTC ISO 8601 字串（例 `2026-08-20T10:00:00Z`），原樣存入、原樣吐回。
        - 開課的教練就是 token 裡的本人，body 不用（也不能）指定教練。
        - 成功回 201（不是 200），data.course 是完整課程物件。驗收口徑：狀態碼數字供參考，驗收只看 2xx／4xx 與 body 的 `status` 欄位。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - skill_id
                - name
                - description
                - start_at
                - end_at
                - max_participants
                - meeting_url
              properties:
                skill_id:
                  type: string
                  description: 技能 id（uuid），來自 GET /api/coaches/skill 的下拉選單
                  example: 1c8da31a-5fb2-4f2b-9d3e-6a7b8c9d0e1f
                name:
                  type: string
                  example: 重訓基礎入門
                description:
                  type: string
                  example: 從零開始的重訓課，教你正確使用器材與姿勢。
                start_at:
                  type: string
                  description: 課程開始時間，UTC ISO 8601 字串
                  example: '2026-08-20T10:00:00Z'
                end_at:
                  type: string
                  description: 課程結束時間，UTC ISO 8601 字串
                  example: '2026-08-20T12:00:00Z'
                max_participants:
                  type: integer
