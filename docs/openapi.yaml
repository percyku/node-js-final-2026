  # ===== g6-booking =====
  /api/courses/{courseId}:
      post:
        tags:
          - M5 購買與報名
        summary: 報名課程（學員用 token 報名一門課，最容易踩雷）
        description: |
          【重要：四句固定錯誤訊息文字都在這支 API】

          前端拿到錯誤回應後，會用 `message` 文字判斷要開哪個提示視窗。
          下面四句訊息是固定錯誤訊息文字——**多一個字、少一個字、改個標點都不行**。
          只要改了一個字，前端的報名按鈕就會看起來「沒反應」（畫面不跳任何提示），而且非常難 debug：

          1. 「已經報名過此課程」（400）
          2. 「已無可使用堂數」（400）
          3. 「已達最大參加人數，無法參加」（400）
          4. 「請先登入」（401，沒帶 token 時的回覆）

          【行為備註】
          - 這支**不需要 request body**：要報名的課由網址的 courseId 決定、報名的人由 token 決定。
          - 錯誤檢查順序（順序也要照做，先中的先回）：
            ① courseId 查無此課程 → 400「ID錯誤」
            ② 這位使用者對這門課**已有報名紀錄（包含已取消的紀錄）** → 400「已經報名過此課程」
            ③ 剩餘堂數歸零 → 400「已無可使用堂數」
            ④ 這門課目前的有效報名人數已達名額上限 → 400「已達最大參加人數，無法參加」
            全部通過 → 建立報名紀錄，回 201、data 為 null。
          - ⚠️「取消過的課不能再報名」：檢查②比對報名紀錄時**不排除已取消的**，
            所以同一門課取消後再報名，會吃到「已經報名過此課程」。這是規格，不是 bug。
          - 剩餘堂數沒有獨立欄位：剩餘堂數 ＝ 所有方案購買的堂數加總 − 未取消的報名數，
            每次報名時即時算出來。
          - 文件寫的狀態碼是實際數字供參考；驗收尺度只看「2xx／4xx ＋ 回應的 status 欄位」，
            但 message 的四句固定錯誤訊息文字沒有放寬空間。
        security:
          - bearerAuth: []
        parameters:
          - name: courseId
            in: path
            required: true
            description: 課程 id（uuid 字串）
            schema:
              type: string
              format: uuid
              example: "fb1d67ef-2b9a-4d10-8f3e-1c2d3e4f5a6b"
        responses:
          '201':
            description: 報名成功（通過全部四道檢查後建立報名紀錄）
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: success
                    data:
                      nullable: true
                      example: null
                example:
                  status: "success"
                  data: null
          '400':
            description: |
              可預期失敗，依檢查順序觸發。下列三句報名流程的固定錯誤訊息文字必須完全相同；「ID錯誤」是建議範例：
              - courseId 查無此課程 → 「ID錯誤」
              - 已有此課程的報名紀錄（含已取消） → 「已經報名過此課程」
              - 剩餘堂數歸零（購買堂數加總 − 未取消報名數 ≤ 0，沒買過方案也算） → 「已無可使用堂數」
              - 課程有效報名人數已達上限 → 「已達最大參加人數，無法參加」
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: failed
                    message:
                      type: string
                examples:
                  courseNotFound:
                    summary: courseId 查無此課程
                    value:
                      status: "failed"
                      message: "ID錯誤"
                  alreadyBooked:
                    summary: 已有報名紀錄（包含已取消的，固定錯誤訊息文字①）
                    value:
                      status: "failed"
                      message: "已經報名過此課程"
                  noCreditLeft:
                    summary: 剩餘堂數歸零（固定錯誤訊息文字②）
                    value:
                      status: "failed"
                      message: "已無可使用堂數"
                  courseFull:
                    summary: 已達名額上限（固定錯誤訊息文字③）
                    value:
                      status: "failed"
                      message: "已達最大參加人數，無法參加"
          '401':
            description: |
              登入檢查失敗。⚠️「請先登入」是固定錯誤訊息文字④，前端靠這句決定要不要跳登入提示。
              - 沒帶 Authorization header、或格式不是 Bearer token → 「請先登入」
              - token 已過期 → 「Token 已過期」
              - token 無效或查無此使用者 → 「無效的 token」
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: failed
                    message:
                      type: string
                examples:
                  notLoggedIn:
                    summary: 沒帶 token（固定錯誤訊息文字④）
                    value:
                      status: "failed"
                      message: "請先登入"
                  tokenExpired:
                    summary: token 已過期
                    value:
                      status: "failed"
                      message: "Token 已過期"
                  invalidToken:
                    summary: token 無效或查無使用者
                    value:
                      status: "failed"
                      message: "無效的 token"
      delete:
        tags:
          - M5 購買與報名
        summary: 取消課程報名（軟刪除：紀錄保留、標記取消、堂數自動歸還）
        description: |
          【行為備註】
          - 取消＝**軟刪除**：報名紀錄不會被刪掉，只是在紀錄上標記「已取消」的時間。
          - 堂數自動歸還：因為剩餘堂數是「購買堂數加總 − 未取消報名數」即時算出來的，
            報名一取消，未取消數就少一，堂數自然回來——不需要另外把堂數「加回去」。
          - ⚠️ 但取消過的課**不能再報名**：報名那支（POST）的重複檢查包含已取消紀錄，
            因此同一門課取消後再報名，仍會回「已經報名過此課程」。請在報名檢查中保留這個限制。
          - 失敗條件：找不到「這位使用者、這門課、而且還沒取消」的報名紀錄 → 400「ID錯誤」。
            課程不存在、從未報名過、已經取消過——三種情況都回同一句「ID錯誤」。
          - 極罕見的情況下標記取消沒成功會回 400「取消失敗」，不在驗收範圍，知道有這回事就好。
          - 成功回 200、data 為 null。狀態碼供參考，驗收尺度只看 2xx／4xx ＋ status 欄位。
        security:
          - bearerAuth: []
        parameters:
          - name: courseId
            in: path
            required: true
            description: 課程 id（uuid 字串）
            schema:
              type: string
              format: uuid
              example: "fb1d67ef-2b9a-4d10-8f3e-1c2d3e4f5a6b"
        responses:
          '200':
            description: 取消成功（報名紀錄被標記為已取消，堂數歸還）
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: success
                    data:
                      nullable: true
                      example: null
                example:
                  status: "success"
                  data: null
          '400':
            description: |
              找不到「這位使用者對這門課、尚未取消」的報名紀錄
              （課程不存在／從未報名／已經取消過，三種情況都回這句）
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: failed
                    message:
                      type: string
                examples:
                  noActiveBooking:
                    summary: 沒有可取消的報名紀錄
                    value:
                      status: "failed"
                      message: "ID錯誤"
          '401':
            description: |
              登入檢查失敗：
              - 沒帶 Authorization header、或格式不是 Bearer token → 「請先登入」
              - token 已過期 → 「Token 已過期」
              - token 無效或查無此使用者 → 「無效的 token」
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: failed
                    message:
                      type: string
                examples:
                  notLoggedIn:
                    summary: 沒帶 token
                    value:
                      status: "failed"
                      message: "請先登入"
                  tokenExpired:
                    summary: token 已過期
                    value:
                      status: "failed"
                      message: "Token 已過期"
                  invalidToken:
                    summary: token 無效或查無使用者
                    value:
                      status: "failed"
                      message: "無效的 token"
  /api/upload:
    post:
      tags:
        - 加分題
      summary: 上傳圖片（選做加分題，不列驗收）
      description: |
        【選做加分題，不列入驗收】
        - 這支**不在驗收範圍**，前端成品也完全沒有呼叫它（教練頭像是手動貼圖片網址）。
        - 答案版的行為只是「示意」：不管你傳什麼（甚至不傳檔案），都回一個**固定寫死的 image_url**，
          沒有真的儲存任何檔案。本文件照答案版行為撰寫。
        - 想拿加分：把它做成真的圖片上傳——收 multipart/form-data 的圖片檔、
          存到任一個你選的雲端圖片空間、回傳一個真的可以打開的圖片網址。
          建議限制：只收 jpg／png、單檔 2MB 以內。
        - 一樣需要登入：沒帶 token 回 401「請先登入」。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        description: |
          答案版示意行為不會讀取檔案內容，傳不傳都回固定網址。
          若要真做加分版，請用 multipart/form-data、欄位名稱用 file。
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 圖片檔（jpg／png，建議 2MB 以內），欄位名稱用 file，例如 avatar.png
      responses:
        '200':
          description: 上傳成功（答案版回固定示意網址；加分版回真實圖片網址）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      image_url:
                        type: string
                        example: "https://example.com/your-uploaded-image.jpg"
              example:
                status: "success"
                data:
                  image_url: "https://example.com/your-uploaded-image.jpg"
        '401':
          description: |
            登入檢查失敗：
            - 沒帶 Authorization header、或格式不是 Bearer token → 「請先登入」
            - token 已過期 → 「Token 已過期」
            - token 無效或查無此使用者 → 「無效的 token」
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                notLoggedIn:
                  summary: 沒帶 token
                  value:
                    status: "failed"
                    message: "請先登入"
                tokenExpired:
                  summary: token 已過期
                  value:
                    status: "failed"
                    message: "Token 已過期"
                invalidToken:
                  summary: token 無效或查無使用者
                  value:
                    status: "failed"
                    message: "無效的 token"
