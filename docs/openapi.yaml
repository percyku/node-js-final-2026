  /api/admin/coaches/revenue:
    get:
      tags:
        - M6 月營收（挑戰）
      summary: 取得教練本人指定月份的營收統計
      description: |
        教練後台「營收報表」頁呼叫。需要登入，且登入者必須已經是教練。

        ⚠️ 這支有三條「不寫出來你一定會猜錯」的隱形語意，請照著做：

        1. **算哪一個月，看「報名建立時間」**：一筆報名算進哪個月，依據是它「**被建立的時間**」，不是課程的上課時間。8 月報名 9 月的課，算 **8 月**的營收。已取消的報名不計。
        2. **年份固定是伺服器的「當年」**：`?month=` 收**英文小寫月份名**（january、february、…、december），不是數字、也不是 YYYY-MM。查 `june` 就是查「今年 6 月」，不支援跨年查詢。
        3. **營收公式（floor 放在最後一步）**：
           - 單堂均價 = **全部**購買方案的 Σprice ÷ Σcredit_amount（所有方案一起算，不是只算某一包）
           - 營收 revenue = floor(該月未取消報名筆數 × 單堂均價)——**先乘再無條件捨去**，不要先把均價捨去再乘。

        可以手算驗證的範例：系統裡共 2 個方案——「10 堂 1000 元」＋「3 堂 1000 元」→ 單堂均價 = (1000+1000) ÷ (10+3) = 2000 ÷ 13 ≈ 153.846…；該月未取消報名 2 筆 → revenue = floor(2 × 153.846…) = floor(307.69…) = **307**。

        回傳欄位語意：
        - `data.total.revenue`：上面公式算出的整數營收
        - `data.total.participants`：該月不重複的報名學員數（同一人報多堂只算 1 人）
        - `data.total.course_count`：該月未取消的**報名筆數**（⚠️ 欄位名雖然叫 course_count，實際語意是報名數，跟 revenue 公式裡乘的數字是同一個）
        - 教練還沒開過任何課 → 直接回三個 0（200 成功，不是錯誤）

        驗收口徑：狀態碼數字供參考，驗收只看 2xx／4xx 與 body 的 `status` 欄位。
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          description: ⚠️ 英文小寫月份名（january～december），不是數字、不是 YYYY-MM。年份固定為伺服器當年。
          schema:
            type: string
            enum:
              - january
              - february
              - march
              - april
              - may
              - june
              - july
              - august
              - september
              - october
              - november
              - december
          example: june
      responses:
        '200':
          description: 成功取得該月營收統計；教練沒開過任何課時回三個 0（也是成功）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total:
                        type: object
                        properties:
                          revenue:
                            type: integer
                            description: floor(該月未取消報名筆數 × 單堂均價)，單堂均價 = 全部方案 Σprice ÷ Σcredit_amount
                            example: 307
                          participants:
                            type: integer
                            description: 該月不重複的報名學員數
                            example: 2
                          course_count:
                            type: integer
                            description: 該月未取消的報名筆數（欄位名雖叫 course_count，語意是報名數）
                            example: 2
              examples:
                有營收:
                  summary: 方案共「10堂1000元」＋「3堂1000元」、該月 2 筆未取消報名
                  value:
                    status: success
                    data:
                      total:
                        revenue: 307
                        participants: 2
                        course_count: 2
                沒開過課:
                  summary: 教練還沒開過任何課
                  value:
                    status: success
                    data:
                      total:
                        revenue: 0
                        participants: 0
                        course_count: 0
        '400':
          description: |
            month 沒帶、或不是合法的英文小寫月份名（例如送了 6、June、2026-06）時觸發。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              example:
                status: failed
                message: 欄位未填寫正確
        '401':
          description: |
            未登入、token 有問題、或登入者不是教練時觸發。
            ⚠️ 「請先登入」是前端會拿來判斷畫面的固定錯誤訊息文字，一字不差。
            觸發條件對照：沒帶 token →「請先登入」；token 過期 →「Token 已過期」；token 無效 →「無效的 token」；不是教練 →「使用者尚未成為教練」（注意是 401 不是 403）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                未帶token:
                  summary: 沒帶 Authorization header
                  value:
                    status: failed
                    message: 請先登入
                token過期:
                  summary: token 已過期
                  value:
                    status: failed
                    message: Token 已過期
                token無效:
                  summary: token 無效或查無使用者
                  value:
                    status: failed
                    message: 無效的 token
                不是教練:
                  summary: 登入者 role 不是 COACH
                  value:
                    status: failed
                    message: 使用者尚未成為教練
  # ===== g5-public =====
  /api/coaches:
      get:
        tags:
          - M4 公開瀏覽
        summary: 取得教練分頁列表（公開，不用登入）
        description: |
          回傳教練列表，支援分頁。`per` 是每頁筆數、`page` 是第幾頁（從 1 開始）。
          分頁要真的有作用：回第 `page` 頁、每頁最多 `per` 筆；該頁沒資料就回空陣列（仍是成功），不算錯誤。

          ⚠️ 地雷一：`per` 和 `page` 都是「必填」。少帶任何一個、或帶了不能轉成非負整數的值（例如 `per=test`），都要回失敗。message 可參考「欄位未填寫正確」，驗收重點是 4xx + status: failed。
          ⚠️ 地雷二：回傳的 `id` 是「教練 id」，不是使用者 id。前端會拿這個 `id` 去打 `GET /api/coaches/{coachId}`，`user_id` 才是這位教練對應的使用者 id，兩個欄位都要給、不要搞混。
          補充：前端頁面固定用 `per=6&page=1` 呼叫且只用到 `id`，但驗收會帶其他值測分頁與欄位完整性，不能寫死。

          狀態碼尺度：文件寫的 200／400 是實際參考值，驗收只看「2xx／4xx」加上 body 的 `status` 欄位。
        parameters:
          - name: per
            in: query
            required: true
            description: 每頁筆數，必填，必須是可轉成非負整數的字串
            example: "6"
            schema:
              type: string
          - name: page
            in: query
            required: true
            description: 第幾頁（從 1 開始），必填，必須是可轉成非負整數的字串
            example: "1"
            schema:
              type: string
        responses:
          "200":
            description: 成功取得教練列表（該頁沒資料時 data 為空陣列）
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: success
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: 教練 id（uuid，拿這個去查教練詳情）
                          user_id:
                            type: string
                            description: 這位教練對應的使用者 id（uuid）
                          name:
                            type: string
                            description: 教練名字
                example:
                  status: success
                  data:
                    - id: "1c8da31a-5fd2-44f3-897e-4a259e7ec62b"
                      user_id: "9a1b2c3d-4e5f-6789-abcd-ef0123456789"
                      name: "肌肉小美"
          "400":
            description: 觸發條件：缺 per 或 page、或其中任何一個不是可轉成非負整數的字串
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: failed
                    message:
                      type: string
                example:
                  status: failed
                  message: 欄位未填寫正確
  /api/coaches/{coachId}:
    get:
      tags:
        - M4 公開瀏覽
      summary: 取得單一教練詳細資料（公開，不用登入）
      description: |
        用教練 id（uuid 字串）查單一教練。回傳分兩塊：`user`（教練的名字與角色）和 `coach`（教練檔案，最後面掛一個 `skills` 技能名稱陣列）。

        ⚠️ 地雷一：`skills` 是「字串」陣列（例如 ["瑜伽", "重訓"]），不是物件陣列，不要包成 {id, name}。
        ⚠️ 地雷二：查不到教練時，建議回「找不到該教練」。前端會把這句話整頁顯示給使用者看；驗收重點是 4xx + status: failed。
        ⚠️ 地雷三：路徑上的 {coachId} 是列表回的「教練 id」，不是 user_id。拿 user_id 來查會查不到，回「找不到該教練」。

        補充：role 在這支查得到的教練身上固定是 COACH；profile_image_url 可能是 null（教練沒放頭像）。
        傳入非 uuid 格式的亂字串（例如 abc123）不列入驗收；建議回 400 failed，不要讓它變成 500。
        狀態碼尺度：驗收只看「2xx／4xx」加上 body 的 `status` 欄位，實際數字供參考。
      parameters:
        - name: coachId
          in: path
          required: true
          description: 教練 id（uuid 字串，從教練列表的 id 欄位取得）
          example: "1c8da31a-5fd2-44f3-897e-4a259e7ec62b"
          schema:
            type: string
      responses:
        "200":
          description: 成功取得教練詳細資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          name:
                            type: string
                          role:
                            type: string
                            description: 固定是 COACH
                      coach:
                        type: object
                        properties:
                          id:
                            type: string
                            description: 教練 id（uuid）
                          user_id:
                            type: string
                            description: 對應的使用者 id（uuid）
                          experience_years:
                            type: integer
                          description:
                            type: string
                          profile_image_url:
                            type: string
                            nullable: true
                          created_at:
                            type: string
                            description: ISO 8601 時間字串
                          updated_at:
                            type: string
                            description: ISO 8601 時間字串
                          skills:
                            type: array
                            description: 技能名稱「字串」陣列
                            items:
                              type: string
              example:
                status: success
                data:
                  user:
                    name: "肌肉小美"
                    role: "COACH"
                  coach:
                    id: "1c8da31a-5fd2-44f3-897e-4a259e7ec62b"
                    user_id: "9a1b2c3d-4e5f-6789-abcd-ef0123456789"
                    experience_years: 5
                    description: "專長重訓與體態雕塑，帶你安全變壯。"
                    profile_image_url: "https://example.com/avatar.png"
                    created_at: "2026-05-01T08:00:00.000Z"
                    updated_at: "2026-05-01T08:00:00.000Z"
                    skills:
                      - "重訓"
                      - "瑜伽"
        "400":
          description: 觸發條件分兩種：(1) coachId 是合法 uuid 但查無此教練 → 「找不到該教練」；(2) coachId 為空或無效字串（例如字面的 undefined）→ 「欄位未填寫正確」
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                coachNotFound:
                  summary: 查無此教練（建議回這句，前端會整頁顯示）
                  value:
                    status: failed
                    message: 找不到該教練
                invalidCoachId:
                  summary: coachId 為空或無效字串
                  value:
                    status: failed
                    message: 欄位未填寫正確
  /api/coaches/{coachId}/courses:
    get:
      tags:
        - M4 公開瀏覽
      summary: 取得指定教練「未結束」的課程列表（公開，不用登入）
