  /api/users/password:
    put:
      tags:
        - M2 會員系統
      summary: 修改本人的登入密碼
      description: |
        用舊密碼換新密碼。body 固定三個欄位：password（舊密碼）、new_password（新密碼）、
        confirm_new_password（再輸入一次新密碼）。

        行為備註（檢查依下列順序進行，踩到哪條就回哪條的訊息）：
        1. 三個欄位任一缺漏或為空字串 → 400「欄位未填寫正確」
        2. ⚠️ 三個欄位「全部」都要通過密碼規則（含英文大小寫與數字、8～16 字）——
           不是只檢查新密碼，舊密碼格式不符也會擋 → 400「密碼不符合規則，需要包含英文數字大小寫，最短8個字，最長16個字」
        3. ⚠️ 新密碼跟舊密碼相同會被擋 → 400「新密碼不能與舊密碼相同」
        4. new_password 與 confirm_new_password 不一致 → 400「新密碼與驗證新密碼不一致」
        5. 舊密碼比對錯誤 → 400「密碼輸入錯誤」

        僅 Spring Boot 版：帳號沒有密碼時（用第三方登入建立，或登入方式被重設過；GET /api/users/profile 的
        has_password 為 false）這支改為「設定密碼」，不需要舊密碼，password 欄位不論帶什麼都忽略：
        1. 這次登入超過 5 分鐘 → 400「為了確認是本人操作，請重新登入後再設定密碼」
        2. new_password、confirm_new_password 任一缺漏或為空字串 → 400「欄位未填寫正確」
        3. 兩者任一不符密碼規則 → 400（訊息同上方第 2 點）
        4. 兩者不一致 → 400「新密碼與驗證新密碼不一致」
        - 成功 200，data 是 null（沒有任何資料要回）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - new_password
                - confirm_new_password
              properties:
                password:
                  type: string
                  description: 目前的舊密碼（也要符合密碼規則）
                  example: Hexschool12345
                new_password:
                  type: string
                  description: 新密碼，須符合密碼規則且不可與舊密碼相同
                  example: NewHexschool99
                confirm_new_password:
                  type: string
                  description: 再輸入一次新密碼，必須與 new_password 完全一致
                  example: NewHexschool99
            example:
              password: Hexschool12345
              new_password: NewHexschool99
              confirm_new_password: NewHexschool99
      responses:
        '200':
          description: 修改成功，data 為 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    nullable: true
                    example: null
              example:
                status: success
                data: null
        '400':
          description: |
            修改失敗。下方是建議回應範例；驗收重點是 4xx + status: failed。
            - 三欄任一缺漏／空字串：「欄位未填寫正確」
            - 三欄任一不符密碼規則：「密碼不符合規則，需要包含英文數字大小寫，最短8個字，最長16個字」
            - 新密碼與舊密碼相同：「新密碼不能與舊密碼相同」
            - 新密碼與確認新密碼不一致：「新密碼與驗證新密碼不一致」
            - 沒有密碼的帳號設定密碼時，這次登入超過 5 分鐘（僅 Spring Boot 版）：「為了確認是本人操作，請重新登入後再設定密碼」
            - 舊密碼比對錯誤：「密碼輸入錯誤」
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                欄位缺漏:
                  summary: 三欄任一缺漏或為空字串
                  value:
                    status: failed
                    message: 欄位未填寫正確
                密碼不符規則:
                  summary: 三欄任一不符合密碼規則
                  value:
                    status: failed
                    message: 密碼不符合規則，需要包含英文數字大小寫，最短8個字，最長16個字
                新舊相同:
                  summary: 新密碼與舊密碼相同
                  value:
                    status: failed
                    message: 新密碼不能與舊密碼相同
                確認不一致:
                  summary: 新密碼與確認新密碼不一致
                  value:
                    status: failed
                    message: 新密碼與驗證新密碼不一致
                設定密碼需重新登入:
                  summary: 沒有密碼的帳號設定密碼時，這次登入超過 5 分鐘（僅 Spring Boot 版）
                  value:
                    status: failed
                    message: 為了確認是本人操作，請重新登入後再設定密碼
                舊密碼錯誤:
                  summary: 舊密碼比對錯誤
                  value:
                    status: failed
                    message: 密碼輸入錯誤
        '401':
          description: |
            token 驗證失敗。下方是建議回應範例；驗收重點是 4xx + status: failed。只有「請先登入」是固定錯誤訊息文字，必須完全相同。
            - 沒帶 Authorization header、或格式不是 Bearer <token>：「請先登入」
            - token 已過期：「Token 已過期」
            - token 無效（內容不對、或查無此使用者）：「無效的 token」
            ⚠️「請先登入」是四句固定錯誤訊息文字之一，一個字都不能改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                未帶token:
                  summary: 沒帶 Authorization header 或缺 token
                  value:
                    status: failed
                    message: 請先登入
                token過期:
                  summary: token 已過期
                  value:
                    status: failed
                    message: Token 已過期
                token無效:
                  summary: token 無效或查無此使用者
                  value:
                    status: failed
                    message: 無效的 token
