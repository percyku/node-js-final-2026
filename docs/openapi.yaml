        - ⚠️ code 只能使用一次；重送同一個 code 會得到「Facebook 登入驗證失敗」。
        - JWT payload 與一般登入相同，必含 { id, role, exp }。
        - 成功狀態碼是 201，與一般登入一致。
      requestBody:
